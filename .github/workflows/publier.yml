# Construit et publie l'image PostgreSQL sans gosu des bases de storia gérées par Coolify
# (L'Arbre aux mille mots). Coolify retire l'image du registre avant chaque démarrage d'une
# base autonome : une image construite sur le serveur seul ne suffit pas.
# La reconstruction hebdomadaire reprend les correctifs Alpine (apk upgrade du Dockerfile).
name: publier
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          provenance: false
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/laurentvercasson/storia-postgres:18.6-alpine
            ghcr.io/laurentvercasson/storia-postgres:18.6-alpine-${{ github.run_number }}
